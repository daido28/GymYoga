<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GymYogaHRM - Trang quản trị</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      color: #1e293b;
    }

    .navbar {
      background: linear-gradient(90deg, #0d6efd, #2563eb);
      color: white;
    }

    .navbar-content {
      width: min(1100px, calc(100% - 40px));
      min-height: 64px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand {
      margin: 0;
      font-size: 22px;
      font-weight: 700;
    }

    .logout-button {
      border: 1px solid white;
      border-radius: 7px;
      padding: 8px 14px;
      color: white;
      background: transparent;
      cursor: pointer;
      font-size: 14px;
    }

    .logout-button:hover {
      background: white;
      color: #0d6efd;
    }

    main {
      width: min(1100px, calc(100% - 40px));
      margin: 0 auto;
      padding: 48px 0;
    }

    .page-title {
      margin: 0 0 8px;
      font-size: 34px;
    }

    .welcome-text {
      margin: 0 0 32px;
      color: #64748b;
      font-size: 16px;
    }

    .dashboard-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 20px;
    }

    .feature-card {
      display: flex;
      min-height: 230px;
      flex-direction: column;
      padding: 26px;
      border: 1px solid #dbe3ef;
      border-radius: 14px;
      background: white;
      box-shadow: 0 4px 14px rgba(15, 23, 42, 0.08);
    }

    .feature-icon {
      width: 48px;
      height: 48px;
      display: grid;
      place-items: center;
      margin-bottom: 18px;
      border-radius: 12px;
      background: #e8f0ff;
      font-size: 24px;
    }

    .feature-card h2 {
      margin: 0 0 10px;
      font-size: 21px;
    }

    .feature-card p {
      margin: 0;
      color: #64748b;
      line-height: 1.5;
    }

    .feature-link {
      display: inline-block;
      width: fit-content;
      margin-top: auto;
      padding: 10px 16px;
      border-radius: 8px;
      background: #0d6efd;
      color: white;
      font-weight: 600;
      text-decoration: none;
    }

    .feature-link:hover {
      background: #0b5ed7;
    }

    @media (max-width: 750px) {
      main {
        padding: 30px 0;
      }

      .dashboard-grid {
        grid-template-columns: 1fr;
      }

      .page-title {
        font-size: 28px;
      }
    }
  </style>
</head>

<body>
  <header class="navbar">
    <div class="navbar-content">
      <p class="brand">GymYogaHRM</p>
      <button id="logoutButton" class="logout-button">Đăng xuất</button>
    </div>
  </header>

  <main>
    <h1 class="page-title">Trang quản trị</h1>
    <p id="welcomeText" class="welcome-text"></p>

    <section class="dashboard-grid">
      <article class="feature-card">
        <div class="feature-icon">👥</div>
        <h2>Nhân sự</h2>
        <p>Thêm, theo dõi và quản lý hồ sơ nhân viên trong phòng Gym/Yoga.</p>
        <a class="feature-link" href="employees.html">Quản lý nhân sự</a>
      </article>

      <article class="feature-card">
        <div class="feature-icon">🕒</div>
        <h2>Ca làm</h2>
        <p>Thiết lập các ca sáng, chiều, tối và các ca hỗ trợ riêng.</p>
        <a class="feature-link" href="shifts.html">Quản lý ca làm</a>
      </article>

      <article class="feature-card">
        <div class="feature-icon">📅</div>
        <h2>Phân công</h2>
        <p>Lập lịch nhân viên theo ngày và tự động cảnh báo trùng ca.</p>
        <a class="feature-link" href="schedules.html">Quản lý lịch làm</a>
      </article>
    </section>
  </main>

  <script>
    const userText = localStorage.getItem("user");

    if (!userText) {
      window.location.href = "index.html";
    } else {
      const user = JSON.parse(userText);

      document.getElementById("welcomeText").textContent =
        `Xin chào ${user.fullName} - Vai trò: ${user.role}`;
    }

    document.getElementById("logoutButton").addEventListener("click", () => {
      localStorage.removeItem("token");
      localStorage.removeItem("user");
      window.location.href = "index.html";
    });
  </script>
</body>
</html>
