<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GymYogaHRM - Quản lý ca làm</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >
</head>

<body class="bg-light">
  <nav class="navbar navbar-dark bg-primary">
    <div class="container">
      <a class="navbar-brand" href="dashboard.html">GymYogaHRM</a>
      <a class="btn btn-outline-light btn-sm" href="dashboard.html">Quay lại</a>
    </div>
  </nav>

  <main class="container py-4">
    <h1 class="h2 mb-1">Quản lý ca làm</h1>
    <p class="text-secondary mb-4">Thiết lập và xem danh sách mẫu ca.</p>

    <div id="message"></div>

    <div class="card shadow-sm mb-4">
      <div class="card-body">
        <h2 class="h5 mb-3">Tạo ca làm</h2>

        <form id="shiftForm" class="row g-3">
          <div class="col-md-4">
            <label class="form-label" for="shiftCode">Mã ca *</label>
            <input class="form-control" id="shiftCode" placeholder="Ví dụ: SANG" required>
          </div>

          <div class="col-md-4">
            <label class="form-label" for="shiftName">Tên ca *</label>
            <input class="form-control" id="shiftName" placeholder="Ví dụ: Ca sáng" required>
          </div>

          <div class="col-md-2">
            <label class="form-label" for="startTime">Bắt đầu *</label>
            <input class="form-control" id="startTime" type="time" required>
          </div>

          <div class="col-md-2">
            <label class="form-label" for="endTime">Kết thúc *</label>
            <input class="form-control" id="endTime" type="time" required>
          </div>

          <div class="col-12">
            <button class="btn btn-primary" type="submit">Tạo ca làm</button>
          </div>
        </form>
      </div>
    </div>

    <div class="card shadow-sm">
      <div class="card-body">
        <h2 class="h5 mb-3">Danh sách ca làm</h2>

        <div class="table-responsive">
          <table class="table table-hover align-middle">
            <thead>
              <tr>
                <th>Mã ca</th>
                <th>Tên ca</th>
                <th>Bắt đầu</th>
                <th>Kết thúc</th>
                <th>Trạng thái</th>
              </tr>
            </thead>
            <tbody id="shiftTableBody"></tbody>
          </table>
        </div>
      </div>
    </div>
  </main>

  <script src="shifts.js"></script>
</body>
</html>
