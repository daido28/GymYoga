<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GymYogaHRM - Quản lý nhân sự</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >
</head>

<body class="bg-light">
  <nav class="navbar navbar-dark bg-primary">
    <div class="container">
      <a class="navbar-brand" href="dashboard.html">GymYogaHRM</a>
      <a class="btn btn-outline-light btn-sm" href="dashboard.html">Quay lại</a>
    </div>
  </nav>

  <main class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <div>
        <h1 class="h2 mb-1">Quản lý nhân sự</h1>
        <p class="text-secondary mb-0">Thêm và xem danh sách nhân viên.</p>
      </div>
    </div>

    <div id="message"></div>

    <div class="card shadow-sm mb-4">
      <div class="card-body">
        <h2 class="h5 mb-3">Thêm nhân viên</h2>

        <form id="employeeForm" class="row g-3">
          <div class="col-md-6">
            <label class="form-label" for="fullName">Họ tên *</label>
            <input class="form-control" id="fullName" required>
          </div>

          <div class="col-md-6">
            <label class="form-label" for="position">Chức vụ *</label>
            <input class="form-control" id="position" placeholder="Ví dụ: Lễ tân" required>
          </div>

          <div class="col-md-6">
            <label class="form-label" for="phone">Số điện thoại</label>
            <input class="form-control" id="phone">
          </div>

          <div class="col-md-6">
            <label class="form-label" for="email">Email</label>
            <input class="form-control" id="email" type="email">
          </div>

          <div class="col-12">
            <label class="form-label" for="specialty">Chuyên môn</label>
            <input class="form-control" id="specialty" placeholder="Ví dụ: Tiếp đón khách hàng">
          </div>

          <div class="col-12">
            <button class="btn btn-primary" type="submit">Thêm nhân viên</button>
          </div>
        </form>
      </div>
    </div>

    <div class="card shadow-sm">
      <div class="card-body">
        <h2 class="h5 mb-3">Danh sách nhân viên</h2>

        <div class="table-responsive">
          <table class="table table-hover align-middle">
            <thead>
              <tr>
                <th>Mã</th>
                <th>Họ tên</th>
                <th>Chức vụ</th>
                <th>Điện thoại</th>
                <th>Email</th>
                <th>Trạng thái</th>
              </tr>
            </thead>
            <tbody id="employeeTableBody"></tbody>
          </table>
        </div>
      </div>
    </div>
  </main>

  <script src="employees.js"></script>
</body>
</html>
