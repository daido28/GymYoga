<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GymYogaHRM - Phân công lịch làm</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >
</head>

<body class="bg-light">
  <nav class="navbar navbar-dark bg-primary">
    <div class="container">
      <a class="navbar-brand" href="dashboard.html">GymYogaHRM</a>
      <a class="btn btn-outline-light btn-sm" href="dashboard.html">Quay lại</a>
    </div>
  </nav>

  <main class="container py-4">
    <h1 class="h2 mb-1">Phân công lịch làm</h1>
    <p class="text-secondary mb-4">
      Lập, sửa hoặc hủy phân công ca cho nhân viên.
    </p>

    <div id="message"></div>

    <div class="card shadow-sm mb-4">
      <div class="card-body">
        <h2 id="formTitle" class="h5 mb-3">Tạo phân công</h2>

        <form id="scheduleForm" class="row g-3">
          <div class="col-md-4">
            <label for="employeeId" class="form-label">Nhân viên *</label>
            <select id="employeeId" class="form-select" required>
              <option value="">-- Chọn nhân viên --</option>
            </select>
          </div>

          <div class="col-md-3">
            <label for="shiftId" class="form-label">Ca làm *</label>
            <select id="shiftId" class="form-select" required>
              <option value="">-- Chọn ca làm --</option>
            </select>
          </div>

          <div class="col-md-3">
            <label for="workDate" class="form-label">Ngày làm *</label>
            <input id="workDate" class="form-control" type="date" required>
          </div>

          <div class="col-md-2">
            <label for="note" class="form-label">Ghi chú</label>
            <input id="note" class="form-control">
          </div>

          <div class="col-12">
            <button id="submitButton" class="btn btn-primary" type="submit">
              Phân công ca
            </button>

            <button id="cancelEditButton" class="btn btn-secondary ms-2" type="button" hidden>
              Hủy chỉnh sửa
            </button>
          </div>
        </form>
      </div>
    </div>

    <div class="card shadow-sm">
      <div class="card-body">
        <h2 class="h5 mb-3">Danh sách phân công</h2>

        <div class="table-responsive">
          <table class="table table-hover align-middle">
            <thead>
              <tr>
                <th>Ngày làm</th>
                <th>Nhân viên</th>
                <th>Ca làm</th>
                <th>Thời gian</th>
                <th>Trạng thái</th>
                <th>Ghi chú</th>
                <th>Thao tác</th>
              </tr>
            </thead>
            <tbody id="scheduleTableBody"></tbody>
          </table>
        </div>
      </div>
    </div>
  </main>

  <script src="branch-context.js"></script><script src="schedules.js"></script>
</body>
</html>
